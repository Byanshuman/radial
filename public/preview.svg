<svg width="800" height="500" viewBox="0 0 800 500" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="500" rx="16" fill="#020617"/>
  <circle cx="400" cy="250" r="160" stroke="#1e293b" stroke-width="2" stroke-dasharray="6 6"/>
  <circle cx="400" cy="250" r="50" fill="url(#grad_hub)" stroke="#ffffff" stroke-width="2" filter="drop-shadow(0px 8px 24px rgba(255, 107, 0, 0.4))"/>
  <text x="400" y="256" fill="#ffffff" font-family="sans-serif" font-weight="900" font-size="18" text-anchor="middle" letter-spacing="2">HUB</text>
  
  <!-- Pod 1: 270 deg (Top) -->
  <g transform="translate(400, 90)">
    <circle cx="0" cy="0" r="36" fill="#ffffff" stroke="#e2e8f0" stroke-width="2" filter="drop-shadow(0px 4px 12px rgba(0,0,0,0.15))"/>
    <circle cx="0" cy="-6" r="10" fill="#ff6b00" opacity="0.2"/>
    <circle cx="0" cy="-6" r="5" fill="#ff6b00"/>
    <text x="0" y="14" fill="#0f172a" font-family="sans-serif" font-weight="700" font-size="10" text-anchor="middle">Solutions</text>
  </g>

  <!-- Pod 2: 330 deg (Top Right) -->
  <g transform="translate(538, 170)">
    <circle cx="0" cy="0" r="36" fill="#ffffff" stroke="#e2e8f0" stroke-width="2" filter="drop-shadow(0px 4px 12px rgba(0,0,0,0.15))"/>
    <circle cx="0" cy="-6" r="10" fill="#3b82f6" opacity="0.2"/>
    <circle cx="0" cy="-6" r="5" fill="#3b82f6"/>
    <text x="0" y="14" fill="#0f172a" font-family="sans-serif" font-weight="700" font-size="10" text-anchor="middle">Process</text>
  </g>

  <!-- Pod 3: 30 deg (Bottom Right) -->
  <g transform="translate(538, 330)">
    <circle cx="0" cy="0" r="36" fill="#ffffff" stroke="#e2e8f0" stroke-width="2" filter="drop-shadow(0px 4px 12px rgba(0,0,0,0.15))"/>
    <circle cx="0" cy="-6" r="10" fill="#ec4899" opacity="0.2"/>
    <circle cx="0" cy="-6" r="5" fill="#ec4899"/>
    <text x="0" y="14" fill="#0f172a" font-family="sans-serif" font-weight="700" font-size="10" text-anchor="middle">Services</text>
  </g>

  <!-- Pod 4: 90 deg (Bottom) -->
  <g transform="translate(400, 410)">
    <circle cx="0" cy="0" r="36" fill="#ffffff" stroke="#e2e8f0" stroke-width="2" filter="drop-shadow(0px 4px 12px rgba(0,0,0,0.15))"/>
    <circle cx="0" cy="-6" r="10" fill="#10b981" opacity="0.2"/>
    <circle cx="0" cy="-6" r="5" fill="#10b981"/>
    <text x="0" y="14" fill="#0f172a" font-family="sans-serif" font-weight="700" font-size="10" text-anchor="middle">Resources</text>
  </g>

  <!-- Pod 5: 150 deg (Bottom Left) -->
  <g transform="translate(262, 330)">
    <circle cx="0" cy="0" r="36" fill="#ffffff" stroke="#e2e8f0" stroke-width="2" filter="drop-shadow(0px 4px 12px rgba(0,0,0,0.15))"/>
    <circle cx="0" cy="-6" r="10" fill="#f59e0b" opacity="0.2"/>
    <circle cx="0" cy="-6" r="5" fill="#f59e0b"/>
    <text x="0" y="14" fill="#0f172a" font-family="sans-serif" font-weight="700" font-size="10" text-anchor="middle">FAQs</text>
  </g>

  <!-- Pod 6: 210 deg (Top Left) -->
  <g transform="translate(262, 170)">
    <circle cx="0" cy="0" r="36" fill="#ffffff" stroke="#e2e8f0" stroke-width="2" filter="drop-shadow(0px 4px 12px rgba(0,0,0,0.15))"/>
    <circle cx="0" cy="-6" r="10" fill="#8b5cf6" opacity="0.2"/>
    <circle cx="0" cy="-6" r="5" fill="#8b5cf6"/>
    <text x="0" y="14" fill="#0f172a" font-family="sans-serif" font-weight="700" font-size="10" text-anchor="middle">About</text>
  </g>

  <!-- Header Text -->
  <text x="400" y="44" fill="#ffffff" font-family="sans-serif" font-weight="800" font-size="20" text-anchor="middle">Radial Revolver Menu</text>
  <text x="400" y="66" fill="#94a3b8" font-family="sans-serif" font-weight="500" font-size="12" text-anchor="middle">Trig Coordinates [cos(θ), sin(θ)] • Ferris Wheel Counter-Rotation</text>

  <defs>
    <linearGradient id="grad_hub" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff4000"/>
      <stop offset="50%" stop-color="#ff6a00"/>
      <stop offset="100%" stop-color="#ffa34d"/>
    </linearGradient>
  </defs>
</svg>
